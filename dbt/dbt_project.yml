name: fraud_analytics
version: '1.0.0'
config-version: 2
profile: fraud_analytics
require-dbt-version: ['>=1.9.0', '<1.10.0']
model-paths: [models]
macro-paths: [macros]
seed-paths: [seeds]
test-paths: [tests]
clean-targets: [target, dbt_packages]
vars:
  'dbt_date:time_zone': UTC
  large_amount_threshold: 1000
  medium_amount_threshold: 100
  high_risk_rate: 5
  medium_risk_rate: 1
  suspicious_min_transactions: 20
models:
  fraud_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table
      +engine: MergeTree()
      +order_by: tuple()
