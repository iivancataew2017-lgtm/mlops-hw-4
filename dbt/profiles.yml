fraud_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DBT_PORT', '18123') | int }}"
      user: "{{ env_var('DBT_USER', 'dbt') }}"
      password: "{{ env_var('DBT_ENV_SECRET_PASSWORD', 'dbt_local') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'fraud_analytics') }}"
      secure: false
      threads: 2
      connect_timeout: 10
      send_receive_timeout: 300
